[package]
name = "argus_nif"
version = "0.3.0"
edition = "2024"

[lib]
name = "argus_nif"
crate-type = ["cdylib", "rlib"]

[dependencies]
rustler = "0.38"
sha2 = "0.11"
argus-kernel = { path = "../../../argus/crates/argus-kernel" }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
