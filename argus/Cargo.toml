[workspace]
resolver = "2"
members = [
    "crates/argus-kernel",
]
# argus-explain explains the V3 verdict surface (invoke/return/sentinel/levers) and is a separate
# V4 port (parent campaign Task 10, "canonical Argus integrity explanations"). It is excluded from
# the workspace until then so the kernel port's build/test/clippy stay green.
exclude = [
    "crates/argus-explain",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/edlon/einsof"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
