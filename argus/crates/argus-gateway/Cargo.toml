[package]
name = "argus-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
argus-kernel = { workspace = true }
argus-registry = { workspace = true }
argus-sandbox = { workspace = true, features = ["runtime"] }
rig-core = { workspace = true }
rmcp = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }
prost = { workspace = true }
tokio = { workspace = true, features = ["sync", "process", "net", "time", "io-util", "rt"] }
tokio-stream = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
reqwest = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
uuid = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
argus-oracle = { workspace = true }
argus-audit = { workspace = true }
rmcp = { workspace = true, features = ["server", "macros", "transport-io"] }
schemars = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time"] }

[build-dependencies]
tonic-prost-build = "0.14"
