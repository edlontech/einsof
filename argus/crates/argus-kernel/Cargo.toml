[package]
name = "argus-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# (zero runtime dependencies — extraction-friendly; errors are a payload-free enum)

[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

# Charon (Aeneas) extraction scoping. Entry points = the transition call-graph + the
# initial state. Because Charon only queues items reachable from these entry points
# (not the whole crate), this drops the Debug/Display/Hash derives, the dead
# Scope/PathBuf types, and the catalog helpers (none reachable from the transitions),
# while keeping Ord (genuinely needed for BTreeMap key ordering). See the design at
# argus_and_tzimtzum/designs/2026-05-29-extraction-refactor-design.md (Obsidian).
[package.metadata.charon]
start_from = [
    "crate::transitions",
    "crate::state::_::initial",
]
# Opaque iteration helpers: the remaining BTreeSet iterations are isolated here (emitted as
# axiom signatures) pending their VecSet swap. `agent_parent` is now a Vec-backed `VecMap`, so
# its drop helpers iterate transparently (Aeneas models Vec) and were removed from this list.
opaque = [
    "crate::transitions::btree_set_union",
    "crate::transitions::sentinel_flow_gate",
    "crate::state::_::speculative_taint",
]
